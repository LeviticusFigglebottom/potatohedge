# Railway service config for the portfolio manager worker.
# Deploy with: railway up (from this directory) after `railway link`.
#
# The service runs an internal scheduler (node-cron) for the hourly tick,
# so we do NOT use Railway's cron primitive — a single always-on web
# service is simpler and gives us a /health and /run endpoint for free.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
