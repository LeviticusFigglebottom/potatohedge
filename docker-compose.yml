version: '3.9'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Uncomment for Phase 5+ (historical data caching)
  # db:
  #   image: timescale/timescaledb:latest-pg16
  #   ports:
  #     - "5432:5432"
