  #     POSTGRES_DB: optix
  #     POSTGRES_USER: optix
  #     POSTGRES_PASSWORD: changeme
  #   volumes:
  #     - pg_data:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  redis_data:
